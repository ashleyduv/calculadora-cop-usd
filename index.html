<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Divisas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --poppy: #BF1A42;
            /* Deep Poppy */
            --peri: #CDDCFF;
            /* Baby Peri */
        }

        body {
            background-color: #f4f6fc;
        }

        .nav-pills .nav-link {
            color: var(--poppy);
            transition: all 0.3s ease;
        }

        .nav-pills .nav-link:hover {
            background-color: var(--peri);
            color: var(--poppy);
        }

        .nav-pills .nav-link.active {
            background-color: var(--poppy) !important;
            color: white !important;
            box-shadow: 0 4px 10px rgba(191, 26, 66, 0.3);
        }

        .text-poppy {
            color: var(--poppy) !important;
        }

        .bg-peri {
            background-color: var(--peri) !important;
        }

        .form-control:focus {
            border-color: var(--poppy);
            box-shadow: 0 0 0 0.25rem rgba(191, 26, 66, 0.25);
        }

        .border-poppy {
            border-color: var(--poppy) !important;
        }

        .btn-outline-poppy {
            color: var(--poppy);
            border-color: var(--poppy);
            font-weight: 500;
        }

        .btn-outline-poppy:hover,
        .btn-check:checked+.btn-outline-poppy {
            background-color: var(--poppy);
            color: white;
            border-color: var(--poppy);
        }

        .calc-btn {
            height: 60px;
            font-size: 1.25rem;
            font-weight: 600;
            border-radius: 12px;
            transition: transform 0.1s, background-color 0.2s;
        }

        .calc-btn:active {
            transform: scale(0.95);
        }

        .calc-btn-num {
            background-color: #ffffff;
            color: #333;
            border: 1px solid #e0e0e0;
        }

        .calc-btn-op {
            background-color: var(--peri);
            color: var(--poppy);
            border: none;
        }

        .calc-btn-del {
            background-color: var(--poppy);
            color: white;
            border: none;
        }
    </style>
</head>

<body class="py-2">

    <nav class="navbar sticky-top mb-4 p-3 shadow-sm" style="background-color: white;">
        <div class="container" style="max-width: 500px;">
            <ul class="nav nav-pills w-100 nav-justified" id="pills-tab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active fw-semibold" id="tab-simple" data-bs-toggle="pill"
                        data-bs-target="#modulo-simple" type="button" role="tab">
                        <i class="bi bi-arrow-left-right"></i> Simple
                    </button>
                </li>
                <li class="nav-item ms-2" role="presentation">
                    <button class="nav-link fw-semibold" id="tab-suma" data-bs-toggle="pill"
                        data-bs-target="#modulo-suma" type="button" role="tab">
                        <i class="bi bi-calculator"></i> Calculadora
                    </button>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container pb-4" style="max-width: 500px;">
        <div class="tab-content" id="pills-tabContent">

            <!-- Módulo 1: Conversión Simple -->
            <div class="tab-pane fade show active" id="modulo-simple" role="tabpanel">
                <div class="card shadow-sm border-0 rounded-4 mb-4">
                    <div class="card-body p-4">
                        <h5 class="card-title fw-bold mb-3 text-center text-poppy">Conversión Rápida</h5>

                        <div class="btn-group w-100 mb-3" role="group">
                            <input type="radio" class="btn-check" name="modoSimple" id="usdToCop" value="usd" checked>
                            <label class="btn btn-outline-poppy" for="usdToCop">De USD a COP</label>

                            <input type="radio" class="btn-check" name="modoSimple" id="copToUsd" value="cop">
                            <label class="btn btn-outline-poppy" for="copToUsd">De COP a USD</label>
                        </div>

                        <div class="mb-3">
                            <input type="text" inputmode="decimal"
                                class="form-control form-control-lg text-center bg-white border-poppy border-opacity-50 fs-3 text-poppy fw-bold"
                                id="montoSimple" placeholder="0">
                        </div>

                        <div class="p-3 bg-peri rounded-3 text-center">
                            <span class="d-block text-poppy small fw-bold mb-1 opacity-75">EQUIVALE A</span>
                            <h2 class="text-poppy fw-bold mb-0" id="resultadoSimple">0</h2>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Módulo 2: Calculadora de Sumas -->
            <div class="tab-pane fade" id="modulo-suma" role="tabpanel">
                <div class="card shadow-sm border-0 rounded-4 mb-4">
                    <div class="card-body p-3 p-sm-4">
                        <h5 class="card-title fw-bold mb-3 text-center text-poppy">Calculadora de Gastos</h5>

                        <div class="btn-group w-100 mb-3" role="group">
                            <input type="radio" class="btn-check" name="modoSuma" id="sumCop" value="cop" checked>
                            <label class="btn btn-outline-poppy" for="sumCop">Pesos (COP)</label>

                            <input type="radio" class="btn-check" name="modoSuma" id="sumUsd" value="usd">
                            <label class="btn btn-outline-poppy" for="sumUsd">Dólares (USD)</label>
                        </div>

                        <div class="mb-3">
                            <input type="text"
                                class="form-control form-control-lg text-end bg-white border-poppy border-opacity-50 fs-4 font-monospace text-dark"
                                id="montoSuma" placeholder="0">
                        </div>

                        <!-- Teclado de Calculadora con nuevos colores -->
                        <div class="calc-keypad mb-4">
                            <div class="row g-2 mb-2">
                                <div class="col-3"><button type="button"
                                        class="btn shadow-sm w-100 calc-btn calc-btn-num"
                                        onclick="calcBtn('7')">7</button></div>
                                <div class="col-3"><button type="button"
                                        class="btn shadow-sm w-100 calc-btn calc-btn-num"
                                        onclick="calcBtn('8')">8</button></div>
                                <div class="col-3"><button type="button"
                                        class="btn shadow-sm w-100 calc-btn calc-btn-num"
                                        onclick="calcBtn('9')">9</button></div>
                                <div class="col-3"><button type="button"
                                        class="btn shadow-sm w-100 calc-btn calc-btn-del"
                                        onclick="calcClear()">C</button></div>
                            </div>
                            <div class="row g-2 mb-2">
                                <div class="col-3"><button type="button"
                                        class="btn shadow-sm w-100 calc-btn calc-btn-num"
                                        onclick="calcBtn('4')">4</button></div>
                                <div class="col-3"><button type="button"
                                        class="btn shadow-sm w-100 calc-btn calc-btn-num"
                                        onclick="calcBtn('5')">5</button></div>
                                <div class="col-3"><button type="button"
                                        class="btn shadow-sm w-100 calc-btn calc-btn-num"
                                        onclick="calcBtn('6')">6</button></div>
                                <div class="col-3"><button type="button"
                                        class="btn shadow-sm w-100 calc-btn calc-btn-del" onclick="calcDel()"><i
                                            class="bi bi-backspace"></i></button></div>
                            </div>
                            <div class="row g-2 mb-2">
                                <div class="col-3"><button type="button"
                                        class="btn shadow-sm w-100 calc-btn calc-btn-num"
                                        onclick="calcBtn('1')">1</button></div>
                                <div class="col-3"><button type="button"
                                        class="btn shadow-sm w-100 calc-btn calc-btn-num"
                                        onclick="calcBtn('2')">2</button></div>
                                <div class="col-3"><button type="button"
                                        class="btn shadow-sm w-100 calc-btn calc-btn-num"
                                        onclick="calcBtn('3')">3</button></div>
                                <div class="col-3"><button type="button"
                                        class="btn shadow-sm w-100 calc-btn calc-btn-op"
                                        onclick="calcBtn('-')">-</button></div>
                            </div>
                            <div class="row g-2">
                                <div class="col-6"><button type="button"
                                        class="btn shadow-sm w-100 calc-btn calc-btn-num"
                                        onclick="calcBtn('0')">0</button></div>
                                <div class="col-3"><button type="button"
                                        class="btn shadow-sm w-100 calc-btn calc-btn-op fs-4"
                                        onclick="calcBtn(',')">,</button></div>
                                <div class="col-3"><button type="button"
                                        class="btn shadow-sm w-100 calc-btn calc-btn-op fs-4"
                                        onclick="calcBtn('+')">+</button></div>
                            </div>
                        </div>

                        <!-- Resultado -->
                        <div class="p-3 bg-peri rounded-3 text-center">
                            <span class="d-block text-poppy small fw-bold mb-1 opacity-75">TOTAL CONVERTIDO</span>
                            <h2 class="text-poppy fw-bold mb-0" id="resultadoSuma">0</h2>
                            <div class="small text-poppy mt-1 fw-semibold opacity-75" id="subtotalSuma">Subtotal: 0
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <p class="text-center small text-muted mb-0 fw-medium" id="tasa-actual">
            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Cargando tasa del
            día...
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        let tasaCambio = 0;

        const inputSimple = document.getElementById('montoSimple');
        const resSimple = document.getElementById('resultadoSimple');
        const radiosSimple = document.getElementsByName('modoSimple');

        const inputSuma = document.getElementById('montoSuma');
        const resSuma = document.getElementById('resultadoSuma');
        const subSuma = document.getElementById('subtotalSuma');
        const radiosSuma = document.getElementsByName('modoSuma');

        const tasaTexto = document.getElementById('tasa-actual');

        const formatoCOP = new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 });
        const formatoUSD = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });

        function aplicarFormatoVisual(str) {
            let limpio = str.replace(/[^\d,]/g, '');
            let partes = limpio.split(',');
            if (partes.length > 2) {
                partes = [partes[0], partes.slice(1).join('')];
            }
            if (partes[0]) {
                partes[0] = partes[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
            }
            return partes.join(',');
        }

        function convertirATextoMatematico(textoVisual) {
            if (!textoVisual) return 0;
            let sinPuntos = textoVisual.replace(/\./g, '');
            let numeroJS = sinPuntos.replace(',', '.');
            const valor = parseFloat(numeroJS);
            return isNaN(valor) ? 0 : valor;
        }

        async function obtenerTasa() {
            try {
                const response = await fetch('https://open.er-api.com/v6/latest/USD');
                const data = await response.json();
                tasaCambio = data.rates.COP;

                const tasaLimpia = formatoCOP.format(tasaCambio).replace('$', '').trim();
                tasaTexto.textContent = `Tasa actual: 1 USD = $${tasaLimpia} COP`;

                calcularSimple();
                calcularSuma();
            } catch (error) {
                tasaTexto.textContent = 'Error al cargar la tasa de cambio.';
            }
        }

        function calcularSimple() {
            if (tasaCambio === 0) return;
            const monto = convertirATextoMatematico(inputSimple.value);
            const modo = document.querySelector('input[name="modoSimple"]:checked').value;

            if (modo === 'usd') {
                resSimple.textContent = formatoCOP.format(monto * tasaCambio);
            } else {
                resSimple.textContent = formatoUSD.format(monto / tasaCambio);
            }
        }

        inputSimple.addEventListener('input', function () {
            let cursor = this.selectionStart;
            let oldLength = this.value.length;

            this.value = aplicarFormatoVisual(this.value);

            let newLength = this.value.length;
            this.setSelectionRange(cursor + (newLength - oldLength), cursor + (newLength - oldLength));

            calcularSimple();
        });
        radiosSimple.forEach(radio => radio.addEventListener('change', calcularSimple));

        function calcularSuma() {
            if (tasaCambio === 0) return;

            let stringMatematico = inputSuma.value.replace(/\./g, '').replace(/,/g, '.').replace(/\s+/g, '');
            let tokens = stringMatematico.match(/[+\-]?([0-9.]+)/g) || [];

            const totalSumado = tokens.reduce((total, token) => {
                const valor = parseFloat(token);
                return total + (isNaN(valor) ? 0 : valor);
            }, 0);

            const modo = document.querySelector('input[name="modoSuma"]:checked').value;

            if (modo === 'cop') {
                subSuma.textContent = `Subtotal: ${formatoCOP.format(totalSumado)}`;
                resSuma.textContent = formatoUSD.format(totalSumado / tasaCambio);
            } else {
                subSuma.textContent = `Subtotal: ${formatoUSD.format(totalSumado)}`;
                resSuma.textContent = formatoCOP.format(totalSumado * tasaCambio);
            }
        }

        inputSuma.addEventListener('input', function () {
            let cursor = this.selectionStart;
            let oldLength = this.value.length;

            let textoPermitido = this.value.replace(/[^\d,+\-\s]/g, '');
            this.value = textoPermitido.replace(/[\d,]+/g, match => aplicarFormatoVisual(match));

            let newLength = this.value.length;
            this.setSelectionRange(cursor + (newLength - oldLength), cursor + (newLength - oldLength));

            calcularSuma();
        });
        radiosSuma.forEach(radio => radio.addEventListener('change', calcularSuma));

        function simularEscritura() {
            inputSuma.dispatchEvent(new Event('input'));
        }

        function calcBtn(caracter) {
            if (caracter === '+' || caracter === '-') {
                inputSuma.value += ` ${caracter} `;
            } else {
                inputSuma.value += caracter;
            }
            simularEscritura();
        }

        function calcClear() {
            inputSuma.value = '';
            simularEscritura();
        }

        function calcDel() {
            let actual = inputSuma.value;
            if (actual.endsWith(' ')) {
                inputSuma.value = actual.trim().slice(0, -1).trim();
            } else {
                inputSuma.value = actual.slice(0, -1);
            }
            simularEscritura();
        }

        obtenerTasa();
    </script>
</body>

</html>
